name: Release desktop

# Se déclenche uniquement sur un tag "vX.Y.Z" poussé sur le dépôt — jamais
# automatiquement sur un simple commit/push de branche.
on:
  push:
    tags:
      - "v*"

# Nécessaire pour qu'electron-builder puisse créer/publier une Release
# GitHub (draft par défaut — voir note en bas de fichier) avec GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  # Les 3 jobs `build` tournent en parallèle et appellent chacun
  # electron-builder --publish always, qui crée la Release GitHub si elle
  # n'existe pas encore. Sans coordination, les 3 jobs démarrent quasi en
  # même temps sur un tag flambant neuf et créent chacun LEUR PROPRE
  # brouillon (race condition confirmée en pratique : plusieurs releases
  # dupliquées "v0.1.10", une seule avec les assets Linux, les autres
  # Windows/macOS chacune isolée dans son propre brouillon). Ce job crée
  # donc le brouillon en premier, seul — les jobs `build` en dépendent
  # (`needs`) et se contentent d'y ajouter leurs assets un par un, plus de
  # race possible sur la création.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Crée le brouillon de Release GitHub (si pas déjà existant)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release view "$TAG" --repo "${{ github.repository }}" \
            || gh release create "$TAG" \
                 --repo "${{ github.repository }}" \
                 --draft \
                 --title "${TAG#v}"

  # Gate qui manquait : ce workflow ne lançait jamais lint/typecheck/tests,
  # seulement les builds (esbuild ne fait AUCUNE vérification de type, il
  # transpile juste — une vraie erreur TypeScript peut produire un bundle
  # qui se construit sans broncher). Le pre-commit hook local (voir
  # .husky/pre-commit, CLAUDE.md § Habitudes) réduit le risque mais est
  # contournable (`--no-verify`) et ne tourne de toute façon jamais ICI, sur
  # GitHub Actions — ce job est le vrai verrou côté release. Tourne en
  # parallèle de create-release (indépendant), `build` attend les deux.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    needs: [create-release, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flag: --linux
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Installe les dépendances du monorepo
        run: pnpm install --frozen-lockfile

      - name: Exporte le build web (Expo) chargé par Electron
        # EXPO_PUBLIC_* : Expo les inline DANS le bundle à ce moment précis
        # (pas à l'exécution) — voir apps/mobile/lib/sync/supabaseClient.ts.
        # Sans ça, `supabase` y reste `null`, la carte "Compte" de
        # SettingsScreen.tsx ne s'affiche jamais (auth.available === false)
        # et l'authentification/synchro est invisible dans TOUTE release
        # construite par ce workflow, quoi qu'on fasse côté app — cause
        # racine trouvée après coup, corrigée ici. Secrets à créer soi-même
        # dans Settings → Secrets and variables → Actions du dépôt (valeurs
        # dans la mémoire du projet 123ecriture-vault-sync.md) : sans eux,
        # ces variables restent vides et le problème persiste malgré ce fix.
        run: pnpm --filter @123ecriture/mobile build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Bundle le process principal Electron (esbuild)
        run: pnpm --filter @123ecriture/desktop run build:electron

      - name: Build + publie l'installateur desktop
        # provider/owner/repo viennent de apps/desktop/package.json (champs
        # "build.publish" et "repository") — --publish always n'a d'effet
        # que sur ce workflow (déclenché sur tag) ; les scripts pnpm locaux
        # (package:linux/win/mac) passent --publish never.
        #
        # apps/desktop/package.json → build.nsis.differentialPackage=false :
        # désactive la génération du .exe.blockmap (index de blocs pour les
        # mises à jour DIFFÉRENTIELLES d'electron-updater, voir
        # electron/updater.ts) — décision explicite de l'utilisatrice pour
        # une liste d'assets plus propre sur GitHub. latest.yml reste
        # généré (indispensable, c'est ce qui indique à l'app Windows
        # qu'une mise à jour existe) ; seul l'aspect "delta" disparaît —
        # l'auto-update télécharge désormais toujours l'installateur complet
        # plutôt qu'un patch des blocs modifiés.
        #
        # PAS de `dmg.writeUpdateInfo=false` équivalent côté macOS : testé
        # une fois (v0.1.20), et contrairement à ce que documentation/
        # recherche suggéraient, cette option désactive la génération de
        # latest-mac.yml EN MÊME TEMPS que le .dmg.blockmap — pas de bascule
        # plus fine côté electron-builder pour ne retirer que le blockmap.
        # Sans latest-mac.yml, les installations macOS existantes ne
        # détectent plus du tout les nouvelles releases (vérifié : la
        # release v0.1.20 publiée sans ce fichier ne s'est jamais proposée
        # comme mise à jour). Le .dmg.blockmap reste donc généré : seul
        # compromis qui ne casse pas l'auto-update macOS. Rien à faire côté
        # .AppImage : pas de blockmap pour ce format de toute façon.
        run: pnpm --filter @123ecriture/desktop exec electron-builder ${{ matrix.flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publication automatique — voir CLAUDE.md "CI / release". Décision
  # explicite (pas un défaut technique) : electron-updater tourne avec
  # autoDownload/autoInstallOnAppQuit (apps/desktop/electron/updater.ts), et
  # ne voit que les Releases PUBLIÉES (jamais les brouillons) — publier ici
  # équivaut donc à déployer immédiatement vers toutes les installations
  # existantes, sans relecture humaine entre "ça build" et "ça part". Ne
  # tourne qu'une fois les 3 builds (Linux/Windows/macOS) réussis
  # (`needs: build`, échoue si un seul des trois échoue — pas de publication
  # partielle) ET seulement après avoir vérifié que les 3 installateurs sont
  # bien attachés : garde-fou contre exactement le bug déjà rencontré une
  # fois (tag poussé sans bump de version dans apps/desktop/package.json →
  # electron-builder résout la mauvaise Release cible et skippe l'upload en
  # silence, laissant un brouillon vide avec seulement l'archive "Source
  # code" auto-générée par GitHub).
  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Vérifie que les 3 installateurs sont bien présents, puis publie
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          echo "Assets attachés :"
          echo "$ASSETS"

          missing=0
          for pattern in '\.exe$' '\.dmg$' '\.AppImage$'; do
            if ! echo "$ASSETS" | grep -Eq "$pattern"; then
              echo "::error::Installateur manquant pour le motif '$pattern' — publication annulée, le brouillon reste en l'état pour inspection."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          gh release edit "$TAG" --repo "$REPO" --draft=false

# Auto-update (electron-updater, voir apps/desktop/electron/updater.ts) : le
# dépôt doit être PUBLIC pour que l'app installée puisse consulter les
# Releases GitHub sans authentification. Sur un dépôt privé, la vérification
# de mise à jour échoue silencieusement (l'app démarre quand même).
