name: Release desktop

# Se déclenche uniquement sur un tag "vX.Y.Z" poussé sur le dépôt — jamais
# automatiquement sur un simple commit/push de branche.
on:
  push:
    tags:
      - "v*"

# Nécessaire pour qu'electron-builder puisse créer/publier une Release
# GitHub (draft par défaut — voir note en bas de fichier) avec GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flag: --linux
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Installe les dépendances du monorepo
        run: pnpm install --frozen-lockfile

      - name: Exporte le build web (Expo) chargé par Electron
        run: pnpm --filter @123ecriture/mobile build:web

      - name: Build + publie l'installateur desktop
        # provider/owner/repo viennent de apps/desktop/package.json (champs
        # "build.publish" et "repository") — --publish always n'a d'effet
        # que sur ce workflow (déclenché sur tag) ; les scripts pnpm locaux
        # (package:linux/win/mac) passent --publish never.
        run: pnpm --filter @123ecriture/desktop exec electron-builder ${{ matrix.flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Note : electron-builder publie par défaut la Release GitHub en DRAFT.
# Après un push de tag, va sur l'onglet "Releases" du dépôt, vérifie les 3
# installateurs (Linux/Windows/macOS non signés — attends-toi à un
# avertissement Gatekeeper/SmartScreen faute de certificat de signature),
# puis publie-la manuellement quand tu es prêt·e.
