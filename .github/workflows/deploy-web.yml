name: Deploy Web to GitHub Pages

# Déploie l'application web (export Expo d'apps/mobile) sous /123Ecriture/app/
# avec la page de présentation (index.html racine) à la source du site —
# même mécanisme que le deploy-web.yml de 123Promptez, adapté au monorepo.
# Le coffre local de fichiers reste limité en web pour l'instant (pont
# navigateur = Phase 2, voir docs/ARCHITECTURE.md §5) : cette page sert
# surtout de banc d'essai visuel de l'interface.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Export web (base path /123Ecriture/app for GitHub Pages)
        working-directory: apps/mobile
        run: GH_PAGES_BASE_URL=/123Ecriture/app npx expo export --platform web --output-dir dist-pages
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      # GH Pages sert 404.html pour les chemins inconnus en conservant l'URL :
      # copie du shell SPA pour qu'un rafraîchissement ne tombe pas en 404.
      - name: Assemble le site (présentation + application)
        run: |
          mkdir -p site/app
          cp index.html site/
          cp -r apps/mobile/dist-pages/. site/app/
          cp site/app/index.html site/app/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
